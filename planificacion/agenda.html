<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificación IASD Pitraco</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            headerBg: '#f1f5f2',
                            border: '#e1e8e2',
                            assignedBg: '#e8f5e9',
                            assignedText: '#2e7d32',
                            pendingBg: '#fff3e0',
                            pendingText: '#e65100',
                            accent: '#1b5e20'
                        }
                    }
                }
            }
        }
    </script>

</head>
<body class="bg-slate-50 font-sans min-h-screen text-slate-800 flex flex-col justify-between p-4 md:p-8">

    <div class="max-w-7xl mx-auto w-full space-y-6">
        
        <!-- Header Section with Logo & Title -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 md:w-20 md:h-20 flex-shrink-0 flex items-center justify-center p-1 bg-white rounded-xl shadow-xs border border-slate-100">
                    <img 
                        src="https://jmladino.github.io/Rescatados/Imagenes/LogoIglesia.png" 
                        alt="Logo Iglesia Adventista" 
                        class="w-full h-full object-contain"
                        onerror="this.onerror=null; this.src='https://placehold.co/80x80/1b5e20/ffffff?text=IASD';"
                    />
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-slate-800 tracking-tight">
                        Planificación IASD Pitraco
                    </h1>
                </div>
            </div>
            
        </div>

        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-brand-headerBg border-b border-brand-border">
                            <th scope="col" class="py-4 px-6 text-xs md:text-sm font-bold text-slate-700 whitespace-nowrap min-w-[140px]">Sábado</th>
                            <th scope="col" class="py-4 px-4 text-xs md:text-sm font-bold text-slate-700 text-center whitespace-nowrap">Sermón</th>
                            <th scope="col" class="py-4 px-4 text-xs md:text-sm font-bold text-slate-700 text-center whitespace-nowrap">Plataforma Sermón</th>
                            <th scope="col" class="py-4 px-4 text-xs md:text-sm font-bold text-slate-700 text-center whitespace-nowrap">Plataforma Escuela Sabática</th>
                            <th scope="col" class="py-4 px-4 text-xs md:text-sm font-bold text-slate-700 text-center whitespace-nowrap">Misionero</th>
                            <th scope="col" class="py-4 px-4 text-xs md:text-sm font-bold text-slate-700 text-center whitespace-nowrap">Maestro de Escuela Sabática</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-body" class="divide-y divide-slate-100">
                        <!-- Content dynamically generated in JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <footer class="mt-12 mb-4 text-center text-xs text-slate-500 border-t border-slate-200/60 pt-6">
        <div class="flex flex-col sm:flex-row items-center justify-center gap-2">
            <span class="font-semibold text-slate-700">IASD Pitraco Bandera</span>
            <br>
            <span class="hidden sm:inline text-slate-300">•</span>
            <a 
                href="https://maps.app.goo.gl/T4sVdrnijmATE5pC7" 
                target="_blank" 
                rel="noopener noreferrer"
                class="inline-flex items-center gap-1.5 text-emerald-700 hover:text-emerald-800 font-medium hover:underline transition"
            >
                <i class="fa-solid fa-location-dot text-red-500"></i>
                <span>Ver ubicación en Google Maps - IASD Pitraco Bandera, Cholchol, Araucanía</span>
            </a>
        </div>
    </footer>

    <script>
        // Calendario JSON
        const scheduleData = [
{ date: "03-10-2026", roles: [true, true, true, true, true] },
{ date: "10-10-2026", roles: [false, false, false, true, true] },
{ date: "17-10-2026", roles: [true, false, false, false, true] },
{ date: "24-10-2026", roles: [true, false, false, false, true] },
{ date: "31-10-2026", roles: [true, false, false, false, true] },
{ date: "07-11-2026", roles: [false, false, false, false, true] },
{ date: "14-11-2026", roles: [false, false, false, false, true] },
{ date: "21-11-2026", roles: [false, false, false, false, true] },
{ date: "28-11-2026", roles: [false, false, false, false, true] },
{ date: "05-12-2026", roles: [false, false, false, false, true] },
{ date: "12-12-2026", roles: [false, false, false, false, true] },
{ date: "19-12-2026", roles: [false, false, false, false, true] },
{ date: "26-12-2026", roles: [false, false, false, false, true] }
        ];


        // Spanish month abbreviations array
        const monthNamesEs = [
            "ene", "feb", "mar", "abr", "may", "jun",
            "jul", "ago", "sep", "oct", "nov", "dic"
        ];

        /**
         * Converts 'dd-mm-yyyy' to long tooltip format e.g. '03 de oct de 2026'
         */
        function formatDateTooltip(dateStr) {
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;

            const day = parts[0];
            const monthIndex = parseInt(parts[1], 10) - 1;
            const year = parts[2];

            const monthAbbr = monthNamesEs[monthIndex] || parts[1];
            return `${day} de ${monthAbbr} de ${year}`;
        }

        // Mostrar todos los estados en modo de solo lectura
        function renderTable() {
            const tbody = document.getElementById('schedule-body');
            tbody.innerHTML = '';


            scheduleData.forEach((row) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50/70 transition-colors';

                // Date column displaying dd-mm-yyyy with Spanish long date tooltip
                const dateTd = document.createElement('td');
                dateTd.className = 'py-4 px-6 font-bold text-slate-800 text-sm whitespace-nowrap cursor-help';
                
                const tooltipText = formatDateTooltip(row.date);
                dateTd.setAttribute('title', tooltipText);

                dateTd.innerHTML = `
                    <span class="inline-flex items-center gap-1.5 border-b border-dashed border-slate-300 pb-0.5">
                        <i class="fa-regular fa-calendar-days text-slate-400 text-xs"></i>
                        ${row.date}
                    </span>
                `;
                tr.appendChild(dateTd);

                // Role columns
                row.roles.forEach((isAssigned) => {
                    const td = document.createElement('td');
                    td.className = 'py-4 px-3 text-center';

                    const badge = document.createElement('span');
                    badge.className = `inline-flex items-center justify-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-medium border w-28 ${
                        isAssigned
                            ? 'bg-[#e7f6eb] text-[#2e7d32] border-[#c8ebd1]'
                            : 'bg-[#fff3e0] text-[#e65100] border-[#fde2be]'
                    }`;
                    badge.innerHTML = isAssigned
                        ? '<i class="fa-solid fa-check text-[10px]" aria-hidden="true"></i> Asignado'
                        : '<i class="fa-regular fa-circle text-[10px]" aria-hidden="true"></i> Pendiente';
                    td.appendChild(badge);

                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });

        }

        // Initial Load
        window.onload = function() {
            renderTable();
        };
    </script>
</body>
</html>
